<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}StockScanner{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='dashboard.css') }}">
  {% block head %}{% endblock %}
</head>
<body>
  <div id="nav-progress-bar"></div>
  <nav class="topnav">
    <span class="brand">StockScanner</span>
    <a href="{{ url_for('monitor') }}" class="{{ 'active' if request.endpoint == 'monitor' }}">Monitor</a>
    <a href="{{ url_for('history') }}" class="{{ 'active' if request.endpoint == 'history' }}">History</a>
    <a href="{{ url_for('momentum') }}" class="{{ 'active' if request.endpoint == 'momentum' }}">Momentum</a>
    <a href="{{ url_for('macro') }}" class="{{ 'active' if request.endpoint == 'macro' }}">Macro</a>
    <a href="{{ url_for('kangaroo') }}" class="{{ 'active' if request.endpoint == 'kangaroo' }}">Kangaroo Tail</a>
    <a href="{{ url_for('demand') }}" class="{{ 'active' if request.endpoint == 'demand' }}">Demand</a>
    <a href="{{ url_for('triple_screen') }}" class="{{ 'active' if request.endpoint == 'triple_screen' }}">Triple Screen</a>
    <a href="{{ url_for('scanner') }}" class="{{ 'active' if request.endpoint == 'scanner' }}">Scanner Board</a>
    <a href="{{ url_for('volume_spikes') }}" class="{{ 'active' if request.endpoint == 'volume_spikes' }}">Volume Spikes</a>
    <a href="{{ url_for('conviction') }}" class="{{ 'active' if request.endpoint == 'conviction' }}">Conviction</a>
  </nav>
  <main>
    {% block content %}{% endblock %}
  </main>
  <script src="{{ url_for('static', filename='dashboard.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
